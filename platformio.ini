[platformio]
default_envs = m5stickc_plus2

[env:m5stickc_plus2]
platform = espressif32
board = m5stick-c
framework = arduino

; Arduino-ESP32 3.x / PlatformIO platform 55.x:
; The legacy m5stick-c variant can lack pins_arduino.h.
; The classic ESP32 default variant provides that header and normal pin aliases.
; M5Unified identifies the hardware independently at runtime.
board_build.variant = esp32

; M5StickC Plus2 ships with 8 MB flash (old M5Stick-C manifest advertises 4 MB).
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    ricmoo/QRCode @ ^0.0.1
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=0
